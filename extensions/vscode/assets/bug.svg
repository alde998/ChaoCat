<svg width="28" height="22" viewBox="0 0 28 22" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes wing {
      0%, 100% { transform: scaleY(0.55); opacity: 0.35; }
      50% { transform: scaleY(1); opacity: 0.78; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(1px) rotate(-6deg); }
      50% { transform: translateY(-1px) rotate(7deg); }
    }
    #bug { animation: bob 320ms ease-in-out infinite; transform-origin: 14px 11px; }
    .wing { animation: wing 160ms ease-in-out infinite; transform-origin: 14px 11px; }
  </style>
  <g id="bug">
    <ellipse class="wing" cx="9" cy="8" rx="7" ry="4" fill="#9DD6FF" fill-opacity="0.48"/>
